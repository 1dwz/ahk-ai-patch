name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream AutoHotkey ref to build (tag, branch or sha)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Keep in sync with the submodule pin; can be overridden per-run.
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}

jobs:
  # Cheap gate: fail fast if the series no longer applies to upstream.
  patch-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show pinned upstream
        shell: pwsh
        run: |
          git -C upstream log -1 --oneline
          git -C upstream describe --tags --always

      - name: Optional upstream bump
        if: env.UPSTREAM_REF != ''
        shell: pwsh
        run: |
          git -C upstream fetch --depth 1 origin $env:UPSTREAM_REF
          git -C upstream checkout FETCH_HEAD

      - name: Apply patch series (check only)
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1 -CheckOnly

  build:
    needs: patch-check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repository produces exactly these two binaries; one per
          # supported word size.  Debug and Self-contained (AutoHotkeySC.bin)
          # targets were dropped -- the latter does not even compile at the
          # pinned upstream, whose script_module.cpp references members that
          # script.h hides behind #ifndef AUTOHOTKEYSC.
          - { config: Release, platform: x64,   artifact: AutoHotkey64-x64-Release }
          - { config: Release, platform: Win32, artifact: AutoHotkey32-Win32-Release }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Optional upstream bump
        if: env.UPSTREAM_REF != ''
        shell: pwsh
        run: |
          git -C upstream fetch --depth 1 origin $env:UPSTREAM_REF
          git -C upstream checkout FETCH_HEAD

      - name: Apply patch series
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1

      - name: Report applied diff
        shell: pwsh
        run: git -C upstream diff --stat

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        id: build
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/build.ps1 `
            -Configuration '${{ matrix.config }}' `
            -Platform '${{ matrix.platform }}' `
            -OutDir dist

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Only on Release/x64: verify the /AI contract from the freshly built exe.
  verify:
    needs: build
    runs-on: windows-latest
    steps:
      # The parity check below builds a pristine control from the submodule, so
      # this job needs the submodule.  (It used to checkout without it -- fine
      # while verify only consumed the downloaded artifact.)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download x64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey64-x64-Release
          path: dist

      - name: List artifact
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      # The whole point of the build: one executable and nothing it has to load
      # beside it -- and, since the patch set adds no runtime dependency, nothing
      # else at all.  A docs file, an installer or a DLL in this directory means
      # the artifact drifted from "just the interpreter".
      #
      # The expected payload is listed once, in docs/ARTIFACT_CONTENTS.txt, and
      # read by both this check and tools/build.ps1.  Keeping a second copy here
      # already caused a red run once, when a new doc was added to dist/ and
      # this list did not know about it.
      - name: Assert the artifact is the interpreter and nothing else
        shell: pwsh
        run: |
          $manifest = 'docs/ARTIFACT_CONTENTS.txt'
          if (-not (Test-Path $manifest)) {
            Write-Output "::error::$manifest is missing; it lists the expected artifact payload"
            exit 1
          }
          $allowed = @(Get-Content $manifest | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          # <arch> must be substituted literally: it appears mid-string in
          # AutoHotkey<arch>.exe, and using -replace would treat the brackets as
          # regex and silently match nothing.
          $allowed = @($allowed | ForEach-Object { $_.Replace('<arch>', '64') })
          Write-Output "expected payload: $($allowed -join ', ')"

          $present = @(Get-ChildItem dist -Recurse -File | ForEach-Object { $_.Name } | Sort-Object)
          Write-Output "actual payload  : $($present -join ', ')"

          $extra = @($present | Where-Object { $allowed -notcontains $_ })
          if ($extra) {
            Write-Output "::error::unexpected file(s) in the artifact: $($extra -join ', ')"
            exit 1
          }
          $missing = @($allowed | Where-Object { $present -notcontains $_ })
          if ($missing) {
            Write-Output "::error::missing from the artifact: $($missing -join ', ')"
            exit 1
          }

          # A loadable DLL beside the exe would defeat the single-file promise.
          $dlls = @(Get-ChildItem dist -Recurse -File -Filter *.dll)
          if ($dlls) {
            Write-Output "::error::a DLL shipped beside the exe: $($dlls.Name -join ', ')"
            exit 1
          }
          Write-Output 'OK: artifact payload matches the manifest, no DLL shipped'
          Write-Output ("size: {0:N0} bytes" -f (Get-Item 'dist/AutoHotkey64.exe').Length)

      - name: Run non-interactive smoke tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-noninteractive.ps1 -Exe dist/AutoHotkey64.exe

      # The smoke test always redirects stderr into a pipe, so it can only prove
      # the diagnostic BYTES exist -- not that a human typing the command would
      # ever see them.  AutoHotkey.exe is a GUI-subsystem binary, so those are
      # genuinely different questions, and this step owns a real console to ask
      # the second one.
      - name: Assert /AI diagnostics are visible on a bare console
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-console-visibility.ps1 -Exe dist/AutoHotkey64.exe

      # The strongest available claim about this patch set is that an ORDINARY
      # invocation is byte-identical to stock.  That needs a pristine binary from
      # the same pinned commit, built here and compared against the artifact
      # under test -- and it is also the control for the two divergence checks
      # that follow (OutputDebug, behaviour parity).
      - name: Build the pristine control from the same pin
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'pristine.zip'
          # The pinned commit, straight out of the submodule.  --format=zip avoids
          # piping git's tar stream, which is fragile on PowerShell.
          git -C upstream archive --format=zip -o $zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed: $LASTEXITCODE" }
          Expand-Archive -Path $zip -DestinationPath pristine-test -Force
          if (-not (Test-Path 'pristine-test/AutoHotkeyx.sln')) {
            throw 'pristine-test did not extract (AutoHotkeyx.sln missing)'
          }
          # No setup-msbuild needed: build.ps1 locates VS itself via vswhere and
          # sources vcvarsall.bat, so it behaves the same here as in the build job.
          #
          # Deliberately NO -OutDir here.  The -OutDir branch of build.ps1 runs
          # the console visibility check against the binary it just built, and a
          # pristine control is built from the same source but should not be
          # assumed to have run it.  Without -OutDir the build lands in
          # pristine-test/bin/; copy it for parity.
          pwsh -NoProfile -File tools/build.ps1 -UpstreamDir pristine-test `
               -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { throw "pristine build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path pristine-dist | Out-Null
          Copy-Item pristine-test/bin/AutoHotkey64.exe pristine-dist/AutoHotkey64.exe
          if (-not (Test-Path 'pristine-dist/AutoHotkey64.exe')) {
            throw 'pristine binary missing after build'
          }

      # The parity script's last section compares the PATCHED parser source
      # (upstream/) with the pristine source (pristine-test/) to prove the new
      # switches are additions.  upstream/ is a clean submodule checkout here, so
      # apply the series first -- the pristine build above already archived the
      # submodule HEAD from git, which is unaffected by worktree patches.
      - name: Apply patch series (for the source-addition comparison)
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1

      # Several interpreter diagnostics need machine state a runner does not have
      # (a keyboard layout missing a key, a game holding the hook, a debugger
      # client refusing).  test-no-dialog.ps1 cannot reach them, so their gates are
      # asserted against the source text instead -- and against pristine-test below
      # it, which is what proves the assertion is not vacuous.
      - name: Assert every interpreter dialog is gated by /AI
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/test-dialog-guards.ps1 -PristineSource pristine-test

      - name: Assert behaviour is unchanged outside the new switches
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/test-parity.ps1 `
            -Patched dist/AutoHotkey64.exe `
            -Pristine pristine-dist/AutoHotkey64.exe `
            -PristineSource pristine-test

      # The second customisation: OutputDebug() must reach the command line as
      # well as the debugger.  Run with the pristine control, because a stock
      # interpreter prints nothing on stderr for that script either -- a patched
      # build that mirrored nothing would otherwise look identical to one that
      # works.  The control asserts the marker is ABSENT from stock output.
      - name: Assert OutputDebug reaches the console
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/test-outputdebug.ps1 `
            -Exe dist/AutoHotkey64.exe `
            -Pristine pristine-dist/AutoHotkey64.exe

      # Everything above ran against x64 only, yet the repository ships two
      # interpreters.  A 32/64 type-aliasing difference once compiled cleanly for
      # x64 and failed only under Win32, so the second binary gets the same three
      # contracts.  The pristine control stays the x64 one: what it has to prove
      # is that a stock build prints nothing for OutputDebug(), which is
      # arch-independent source behaviour -- and test-outputdebug.ps1 scans the
      # Win32 binary's own patch marker before trusting it as the subject.
      - name: Download Win32 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey32-Win32-Release
          path: dist32

      - name: Assert the 32-bit interpreter honours both contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/test-noninteractive.ps1 -Exe dist32/AutoHotkey32.exe
          pwsh -NoProfile -File tools/test-console-visibility.ps1 -Exe dist32/AutoHotkey32.exe
          pwsh -NoProfile -File tools/test-outputdebug.ps1 `
            -Exe dist32/AutoHotkey32.exe `
            -Pristine pristine-dist/AutoHotkey64.exe

      # The other half of the /AI contract, and the half no earlier step covered:
      # test-noninteractive.ps1 reads stderr, which cannot see a window.  An error
      # that prints AND blocks on a dialog looks healthy to a byte-level assertion
      # and is fatal to an unattended run, so this step watches for windows on a
      # private desktop -- where a leak is recorded instead of landing on a screen.
      # Passing -Pristine makes the watcher prove it can see a dialog at all, on a
      # build that has no /AI.
      - name: Assert /AI raises no window on either interpreter
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/test-no-dialog.ps1 `
            -Exe dist/AutoHotkey64.exe,dist32/AutoHotkey32.exe `
            -Pristine pristine-dist/AutoHotkey64.exe
