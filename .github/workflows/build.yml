name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream AutoHotkey ref to build (tag, branch or sha)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # The libcurl that third_party/curl-static was built from. The build step
  # asserts the committed .lib matches this, so a stale import library can
  # never be linked in silently.
  CURL_VERSION: '8.22.0'
  # Keep in sync with the submodule pin; can be overridden per-run.
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}

jobs:
  # Cheap gate: fail fast if the series no longer applies to upstream.
  patch-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show pinned upstream
        shell: pwsh
        run: |
          git -C upstream log -1 --oneline
          git -C upstream describe --tags --always

      - name: Optional upstream bump
        if: env.UPSTREAM_REF != ''
        shell: pwsh
        run: |
          git -C upstream fetch --depth 1 origin $env:UPSTREAM_REF
          git -C upstream checkout FETCH_HEAD

      - name: Apply patch series (check only)
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1 -CheckOnly

      # libcurl is linked statically, so the build needs the committed import
      # libraries. Catch a missing/corrupt one here rather than 40 minutes into
      # a build, and record the hash so a release can be traced to its inputs.
      - name: Verify static libcurl is present
        shell: pwsh
        run: |
          $libs = @(
            'third_party/curl-static/lib-x64/libcurl.lib',
            'third_party/curl-static/lib-x86/libcurl.lib',
            'third_party/curl-static/include/curl/curl.h'
          )
          $missing = @($libs | Where-Object { -not (Test-Path $_) })
          if ($missing) {
            Write-Output '::error::static libcurl inputs are missing:'
            $missing | ForEach-Object { Write-Output "  $_" }
            Write-Output 'Regenerate them with tools/build-libcurl-static.ps1 -Platform both'
            exit 1
          }
          $libs | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash
            Write-Output ("{0}  {1}  {2:N0} B" -f $h, $_, (Get-Item $_).Length)
          }

  build:
    needs: patch-check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: Release,        platform: x64,   artifact: AutoHotkey64-x64-Release,       experimental: false }
          - { config: Release,        platform: Win32, artifact: AutoHotkey32-Win32-Release,     experimental: false }
          - { config: Debug,          platform: x64,   artifact: AutoHotkey64-x64-Debug,         experimental: false }
          # Self-contained (AutoHotkeySC.bin) does NOT compile at the pinned upstream commit:
          # source/script_module.cpp is compiled unconditionally but references members that
          # script.h hides behind #ifndef AUTOHOTKEYSC. Verified against pristine upstream
          # d8f819c, so this is a pre-existing upstream breakage, not caused by our patches.
          # Kept in the matrix as non-blocking so a future upstream fix is picked up.
          - { config: Self-contained, platform: x64,   artifact: AutoHotkeySC-x64,               experimental: true  }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Optional upstream bump
        if: env.UPSTREAM_REF != ''
        shell: pwsh
        run: |
          git -C upstream fetch --depth 1 origin $env.UPSTREAM_REF
          git -C upstream checkout FETCH_HEAD

      - name: Apply patch series
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1

      - name: Report applied diff
        shell: pwsh
        run: git -C upstream diff --stat

      # libcurl is linked statically from third_party/curl-static (committed), so
      # there is no DLL to ship and no separate libcurl build step.
      - name: Verify static libcurl is present
        shell: pwsh
        run: |
          $bits = if ('${{ matrix.platform }}' -eq 'x64') { 'lib-x64' } else { 'lib-x86' }
          $lib = "third_party/curl-static/$bits/libcurl.lib"
          if (-not (Test-Path $lib)) {
            Write-Output "::error::$lib is missing; run tools/build-libcurl-static.ps1 -Platform both"
            exit 1
          }
          Write-Output ("{0}: {1:N0} bytes" -f $lib, (Get-Item $lib).Length)

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        id: build
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/build.ps1 `
            -Configuration '${{ matrix.config }}' `
            -Platform '${{ matrix.platform }}' `
            -OutDir dist

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Flag experimental failure
        if: matrix.experimental && steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Write-Output "::warning::${{ matrix.artifact }} is an experimental target and failed to build."
          Write-Output "See the matrix comment in build.yml for the known upstream cause."
          exit 0

  # Only on Release/x64: verify the /AI contract from the freshly built exe.
  verify:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download x64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey64-x64-Release
          path: dist

      - name: List artifact
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      # The whole point of the static link: one executable and nothing it has
      # to load beside it.  The generated API docs and the hand-written HTTP/JSON
      # guide are deliberately allowed through -- they ship with the binary so a
      # downloader can read the function list and the option reference -- but a
      # DLL of any name, or anything else, means self-containment is broken.
      #
      # The expected payload is listed once, in docs/ARTIFACT_CONTENTS.txt, and
      # read by both this check and tools/build.ps1.  Keeping a second copy here
      # already caused a red run: when the guide was added to dist/, this list
      # did not know about it.
      - name: Assert the artifact holds no loadable dependency
        shell: pwsh
        run: |
          $manifest = 'docs/ARTIFACT_CONTENTS.txt'
          if (-not (Test-Path $manifest)) {
            Write-Output "::error::$manifest is missing; it lists the expected artifact payload"
            exit 1
          }
          $allowed = @(Get-Content $manifest | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          # <arch> must be substituted literally: it appears mid-string in
          # AutoHotkey<arch>.exe, and using -replace would treat the brackets as
          # regex and silently match nothing.
          $allowed = @($allowed | ForEach-Object { $_.Replace('<arch>', '64') })
          Write-Output "expected payload: $($allowed -join ', ')"

          $present = @(Get-ChildItem dist -Recurse -File | ForEach-Object { $_.Name } | Sort-Object)
          Write-Output "actual payload  : $($present -join ', ')"

          $extra = @($present | Where-Object { $allowed -notcontains $_ })
          if ($extra) {
            Write-Output "::error::unexpected file(s) in the artifact: $($extra -join ', ')"
            exit 1
          }
          $missing = @($allowed | Where-Object { $present -notcontains $_ })
          if ($missing) {
            Write-Output "::error::missing from the artifact: $($missing -join ', ')"
            exit 1
          }

          # A loadable DLL beside the exe would defeat the single-file promise.
          $dlls = @(Get-ChildItem dist -Recurse -File -Filter *.dll)
          if ($dlls) {
            Write-Output "::error::a DLL shipped beside the exe: $($dlls.Name -join ', ')"
            exit 1
          }
          $ascii = [System.Text.Encoding]::ASCII.GetString(
            [System.IO.File]::ReadAllBytes((Resolve-Path 'dist/AutoHotkey64.exe')))
          if ($ascii -match 'libcurl[^"'']*\.dll') {
            Write-Output "::error::exe still imports $($Matches[0]); the static link did not take"
            exit 1
          }
          Write-Output 'OK: artifact payload matches the manifest, no DLL, no libcurl import'
          Write-Output ("size: {0:N0} bytes" -f (Get-Item 'dist/AutoHotkey64.exe').Length)

      - name: Run non-interactive smoke tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-noninteractive.ps1 -Exe dist/AutoHotkey64.exe

      # The smoke test always redirects stderr into a pipe, so it can only prove
      # the diagnostic BYTES exist -- not that a human typing the command would
      # ever see them.  AutoHotkey.exe is a GUI-subsystem binary, so those are
      # genuinely different questions, and this step owns a real console to ask
      # the second one.
      - name: Assert /AI diagnostics are visible on a bare console
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-console-visibility.ps1 -Exe dist/AutoHotkey64.exe

      # The hand-written HTTP/JSON guide ships in the artifact, so its claims are
      # part of what a downloading user relies on.  Nothing else validates them:
      # the generated index only lists signatures for upstream functions.
      - name: Assert the shipped guide matches the built interpreter
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-doc-claims.ps1 -Exe dist/AutoHotkey64.exe

      # /dump-api is what the documentation generator reads, so a regression in
      # it silently produces wrong docs.  Assert the registry counts, the
      # patched functions, and that the expected arity is reported.
      - name: Assert /dump-api reports the full built-in API
        shell: pwsh
        run: |
          $out = & dist/AutoHotkey64.exe /dump-api 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::/dump-api exited $LASTEXITCODE"
            exit 1
          }
          $names = [regex]::Matches($out, '(?m)^([A-Za-z_][A-Za-z0-9_]*)\t') |
            ForEach-Object { $_.Groups[1].Value }
          $unique = @($names | Sort-Object -Unique)
          Write-Output "functions: $($unique.Count)"

          if ($unique.Count -ne 357) {
            Write-Output "::error::expected 357 built-in functions, got $($unique.Count)"
            exit 1
          }
          foreach ($fn in 'HttpRequest', 'JsonParse', 'JsonStringify') {
            if ($unique -notcontains $fn) {
              Write-Output "::error::$fn missing from /dump-api; the patch did not apply"
              exit 1
            }
          }
          # In this section the trailing 'max' field is empty for the
          # BIF1-registered entries, and 'variadic'/'outputs' may be absent,
          # so only the name and the min column are asserted here.  Exact
          # arity for the patched functions is cross-checked locally by
          # tools/extract-api-docs.ps1 -Verify against the running
          # interpreter, which reads g_BIF rather than this text format.
          foreach ($fn in 'HttpRequest', 'JsonParse', 'JsonStringify') {
            if ($out -notmatch "(?m)^$fn`t1`t") {
              Write-Output "::error::$fn is not reported with min arity 1"
              exit 1
            }
          }
          Write-Output 'OK: 357 functions, HttpRequest/JsonParse/JsonStringify present with min arity 1'

      # The JSON suite is fully offline, so it always runs. The HTTP suite
      # needs a live network and would make CI flaky, so it is skipped here and
      # is meant to be run locally (see README).
      - name: Run JSON suite (offline)
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-json-http.ps1 -Exe dist/AutoHotkey64.exe -SkipHttp

  # The installer needs both architectures in one directory and writes to
  # Program Files and HKLM, so it gets its own job that runs elevated (the
  # windows-latest runner is already an administrator).  It is separated from
  # `verify` so an installer regression cannot mask a binary regression, and so
  # a failed install cannot leave the verify runner in a modified state.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download x64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey64-x64-Release
          path: dist/x64

      - name: Download Win32 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey32-Win32-Release
          path: dist/win32

      - name: Assemble both architectures for the installer
        shell: pwsh
        run: |
          # The installer payload needs both interpreters plus the docs in ONE
          # flat directory.  The two artifacts are downloaded separately, so
          # flatten them here rather than teaching pack-installer.ps1 about a
          # per-architecture layout it does not otherwise need.
          New-Item -ItemType Directory -Path dist/flat -Force | Out-Null
          Copy-Item dist/x64/*   dist/flat -Force -Recurse
          Copy-Item dist/win32/* dist/flat -Force -Recurse

          $need = 'AutoHotkey64.exe', 'AutoHotkey32.exe'
          foreach ($n in $need) {
            if (-not (Test-Path "dist/flat/$n")) {
              Write-Output "::error::dist/flat/$n is missing; the installer needs both architectures"
              Get-ChildItem dist -Recurse | Select-Object FullName
              exit 1
            }
          }
          Get-ChildItem dist/flat | Select-Object Name, Length

      - name: Pack the installer
        shell: pwsh
        run: pwsh -NoProfile -File tools/pack-installer.ps1 -Dist dist/flat -OutFile dist/AHK-v2-Setup.exe

      # install -> assert PATH, association, /dump-api, byte-exact extraction ->
      # uninstall -> assert full rollback.  This is the only thing that proves
      # the installer works rather than merely builds.
      - name: End-to-end install and rollback
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-installer.ps1 -Setup dist/AHK-v2-Setup.exe

      # Registry correctness is not the same as the association working, so this
      # launches a real .ahk through ShellExecute and waits for evidence.
      - name: Association actually launches a script
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-association.ps1 -Setup dist/AHK-v2-Setup.exe

      - name: Leave the machine clean
        if: always()
        shell: pwsh
        run: |
          # test-association.ps1 removes its own install in a finally block, but
          # a hard failure earlier can skip that; make the job idempotent.
          if (Test-Path 'C:\Program Files\AHK-v2\uninstall.exe') {
            & 'C:\Program Files\AHK-v2\uninstall.exe' /quiet
            Start-Sleep -Seconds 5
          }
          if (Test-Path 'C:\Program Files\AHK-v2') {
            Remove-Item 'C:\Program Files\AHK-v2' -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AHK-v2-Setup
          path: dist/AHK-v2-Setup.exe
          if-no-files-found: error
