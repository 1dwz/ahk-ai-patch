name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream AutoHotkey ref to build (tag, branch or sha)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Keep in sync with the submodule pin; can be overridden per-run.
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}

jobs:
  # Cheap gate: fail fast if the series no longer applies to upstream.
  patch-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show pinned upstream
        shell: pwsh
        run: |
          git -C upstream log -1 --oneline
          git -C upstream describe --tags --always

      - name: Optional upstream bump
        if: env.UPSTREAM_REF != ''
        shell: pwsh
        run: |
          git -C upstream fetch --depth 1 origin $env:UPSTREAM_REF
          git -C upstream checkout FETCH_HEAD

      - name: Apply patch series (check only)
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1 -CheckOnly

  build:
    needs: patch-check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: Release,        platform: x64,   artifact: AutoHotkey64-x64-Release,       experimental: false }
          - { config: Release,        platform: Win32, artifact: AutoHotkey32-Win32-Release,     experimental: false }
          - { config: Debug,          platform: x64,   artifact: AutoHotkey64-x64-Debug,         experimental: false }
          # Self-contained (AutoHotkeySC.bin) does NOT compile at the pinned upstream commit:
          # source/script_module.cpp is compiled unconditionally but references members that
          # script.h hides behind #ifndef AUTOHOTKEYSC. Verified against pristine upstream
          # d8f819c, so this is a pre-existing upstream breakage, not caused by our patches.
          # Kept in the matrix as non-blocking so a future upstream fix is picked up.
          - { config: Self-contained, platform: x64,   artifact: AutoHotkeySC-x64,               experimental: true  }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Optional upstream bump
        if: env.UPSTREAM_REF != ''
        shell: pwsh
        run: |
          git -C upstream fetch --depth 1 origin $env.UPSTREAM_REF
          git -C upstream checkout FETCH_HEAD

      - name: Apply patch series
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1

      - name: Report applied diff
        shell: pwsh
        run: git -C upstream diff --stat

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        id: build
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/build.ps1 `
            -Configuration '${{ matrix.config }}' `
            -Platform '${{ matrix.platform }}' `
            -OutDir dist

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Flag experimental failure
        if: matrix.experimental && steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Write-Output "::warning::${{ matrix.artifact }} is an experimental target and failed to build."
          Write-Output "See the matrix comment in build.yml for the known upstream cause."
          exit 0

  # Only on Release/x64: verify the /AI contract from the freshly built exe.
  verify:
    needs: build
    runs-on: windows-latest
    steps:
      # The parity check below builds a pristine control from the submodule, so
      # this job needs the submodule.  (It used to checkout without it -- fine
      # while verify only consumed the downloaded artifact.)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download x64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey64-x64-Release
          path: dist

      - name: List artifact
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      # The whole point of the build: one executable and nothing it has to load
      # beside it.  The generated API docs ship with the binary so a downloader
      # can read the function list -- but a DLL of any name, or anything else,
      # means self-containment is broken.
      #
      # The expected payload is listed once, in docs/ARTIFACT_CONTENTS.txt, and
      # read by both this check and tools/build.ps1.  Keeping a second copy here
      # already caused a red run once, when a new doc was added to dist/ and
      # this list did not know about it.
      - name: Assert the artifact holds no loadable dependency
        shell: pwsh
        run: |
          $manifest = 'docs/ARTIFACT_CONTENTS.txt'
          if (-not (Test-Path $manifest)) {
            Write-Output "::error::$manifest is missing; it lists the expected artifact payload"
            exit 1
          }
          $allowed = @(Get-Content $manifest | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          # <arch> must be substituted literally: it appears mid-string in
          # AutoHotkey<arch>.exe, and using -replace would treat the brackets as
          # regex and silently match nothing.
          $allowed = @($allowed | ForEach-Object { $_.Replace('<arch>', '64') })
          Write-Output "expected payload: $($allowed -join ', ')"

          $present = @(Get-ChildItem dist -Recurse -File | ForEach-Object { $_.Name } | Sort-Object)
          Write-Output "actual payload  : $($present -join ', ')"

          $extra = @($present | Where-Object { $allowed -notcontains $_ })
          if ($extra) {
            Write-Output "::error::unexpected file(s) in the artifact: $($extra -join ', ')"
            exit 1
          }
          $missing = @($allowed | Where-Object { $present -notcontains $_ })
          if ($missing) {
            Write-Output "::error::missing from the artifact: $($missing -join ', ')"
            exit 1
          }

          # A loadable DLL beside the exe would defeat the single-file promise.
          $dlls = @(Get-ChildItem dist -Recurse -File -Filter *.dll)
          if ($dlls) {
            Write-Output "::error::a DLL shipped beside the exe: $($dlls.Name -join ', ')"
            exit 1
          }
          Write-Output 'OK: artifact payload matches the manifest, no DLL shipped'
          Write-Output ("size: {0:N0} bytes" -f (Get-Item 'dist/AutoHotkey64.exe').Length)

      - name: Run non-interactive smoke tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-noninteractive.ps1 -Exe dist/AutoHotkey64.exe

      # The smoke test always redirects stderr into a pipe, so it can only prove
      # the diagnostic BYTES exist -- not that a human typing the command would
      # ever see them.  AutoHotkey.exe is a GUI-subsystem binary, so those are
      # genuinely different questions, and this step owns a real console to ask
      # the second one.
      - name: Assert /AI diagnostics are visible on a bare console
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-console-visibility.ps1 -Exe dist/AutoHotkey64.exe

      # The API reference is generated from the SOURCE tree, so this asserts the
      # generator still finds everything it is supposed to: 253 built-ins declared
      # in source/lib/functions.h plus the 101 registered in g_BIF[], totalling
      # the well-known 354.  It also proves every emitted signature is source-
      # derived (no invented parameter names) by re-deriving the name set straight
      # from the source and diffing.
      - name: Assert the API reference covers the full built-in set
        shell: pwsh
        run: |
          $expected = 354
          pwsh -NoProfile -File tools/extract-api-docs.ps1 `
               -Json -OutFile dist/builtin-api.json `
               -Summary dist/BUILTIN_API.md -OutDir dist/api
          if ($LASTEXITCODE -ne 0) { throw "generator exited $LASTEXITCODE" }

          $api = Get-Content dist/builtin-api.json -Raw | ConvertFrom-Json
          Write-Output "functions: $($api.count) ($($api.parameter_names_declared) with declared parameter names, $($api.parameter_names_absent) arity-only)"
          if ($api.count -ne $expected) {
            Write-Output "::error::expected $expected built-in functions, got $($api.count)"
            exit 1
          }

          # Re-derive the name set from the source, independently of the generator.
          $fh = Get-Content upstream/source/lib/functions.h -Raw
          $md = [regex]::Matches($fh, '(?m)^md_func(?:_[a-z]+)?\(\s*([A-Za-z_][A-Za-z0-9_]*)') |
                ForEach-Object { $_.Groups[1].Value }
          $sc = Get-Content upstream/source/script.cpp -Raw
          $bif = [regex]::Matches($sc, '(?m)^\s*BIF[ni1]?\(\s*([A-Za-z_][A-Za-z0-9_]*)') |
                 ForEach-Object { $_.Groups[1].Value }
          $fromSource = @($md + $bif | Sort-Object -Unique)
          $emitted = @($api.functions | ForEach-Object { $_.name } | Sort-Object -Unique)
          $diff = @(Compare-Object $fromSource $emitted)
          if ($diff.Count) {
            Write-Output "::error::generated set differs from the source by $($diff.Count) name(s)"
            $diff | Select-Object -First 20 | ForEach-Object { Write-Output "  $($_.SideIndicator) $($_.InputObject)" }
            exit 1
          }
          Write-Output "OK: $expected functions, name set identical to the source"

          # No entry may carry an invented name: a function whose parameter names
          # are not in the source must report zero parameter names.
          $invented = @($api.functions | Where-Object { -not $_.parameter_names_declared -and $_.params.Count -gt 0 })
          if ($invented.Count) {
            Write-Output "::error::$($invented.Count) arity-only entry(ies) carry invented parameters"
            exit 1
          }
          $placeholders = @($api.functions | ForEach-Object { $_.params } | Where-Object { $_.name -match '^arg\d+$' })
          if ($placeholders.Count) {
            Write-Output "::error::$($placeholders.Count) placeholder parameter name(s) present"
            exit 1
          }
          Write-Output "OK: every parameter name is source-declared; none invented"
      # The goal is "/AI only, as close to upstream as possible", so the strongest
      # available claim is that an ORDINARY invocation is byte-identical to
      # stock.  That needs a pristine binary from the same pinned commit, built
      # here and compared against the artifact under test.
      - name: Build the pristine control from the same pin
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'pristine.zip'
          # The pinned commit, straight out of the submodule.  --format=zip avoids
          # piping git's tar stream, which is fragile on PowerShell.
          git -C upstream archive --format=zip -o $zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed: $LASTEXITCODE" }
          Expand-Archive -Path $zip -DestinationPath pristine-test -Force
          if (-not (Test-Path 'pristine-test/AutoHotkeyx.sln')) {
            throw 'pristine-test did not extract (AutoHotkeyx.sln missing)'
          }
          # No setup-msbuild needed: build.ps1 locates VS itself via vswhere and
          # sources vcvarsall.bat, so it behaves the same here as in the build job.
          #
          # Deliberately NO -OutDir here.  The -OutDir branch of build.ps1 runs
          # the console visibility check against the binary it just built, and a
          # pristine control is built from the same source but should not be
          # assumed to have run it.  Without -OutDir the build lands in
          # pristine-test/bin/; copy it for parity.
          pwsh -NoProfile -File tools/build.ps1 -UpstreamDir pristine-test `
               -Configuration Release -Platform x64
          if ($LASTEXITCODE -ne 0) { throw "pristine build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path pristine-dist | Out-Null
          Copy-Item pristine-test/bin/AutoHotkey64.exe pristine-dist/AutoHotkey64.exe
          if (-not (Test-Path 'pristine-dist/AutoHotkey64.exe')) {
            throw 'pristine binary missing after build'
          }

      # The parity script's last section compares the PATCHED parser source
      # (upstream/) with the pristine source (pristine-test/) to prove the new
      # switches are additions.  upstream/ is a clean submodule checkout here, so
      # apply the series first -- the pristine build above already archived the
      # submodule HEAD from git, which is unaffected by worktree patches.
      - name: Apply patch series (for the source-addition comparison)
        shell: pwsh
        run: pwsh -NoProfile -File tools/apply-patches.ps1

      - name: Assert behaviour is unchanged outside the new switches
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/test-parity.ps1 `
            -Patched dist/AutoHotkey64.exe `
            -Pristine pristine-dist/AutoHotkey64.exe `
            -PristineSource pristine-test

  # The installer needs both architectures in one directory and writes to
  # Program Files and HKLM, so it gets its own job that runs elevated (the
  # windows-latest runner is already an administrator).  It is separated from
  # `verify` so an installer regression cannot mask a binary regression, and so
  # a failed install cannot leave the verify runner in a modified state.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download x64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey64-x64-Release
          path: dist/x64

      - name: Download Win32 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoHotkey32-Win32-Release
          path: dist/win32

      - name: Assemble both architectures for the installer
        shell: pwsh
        run: |
          # The installer payload needs both interpreters plus the docs in ONE
          # flat directory.  The two artifacts are downloaded separately, so
          # flatten them here rather than teaching pack-installer.ps1 about a
          # per-architecture layout it does not otherwise need.
          New-Item -ItemType Directory -Path dist/flat -Force | Out-Null
          Copy-Item dist/x64/*   dist/flat -Force -Recurse
          Copy-Item dist/win32/* dist/flat -Force -Recurse

          $need = 'AutoHotkey64.exe', 'AutoHotkey32.exe'
          foreach ($n in $need) {
            if (-not (Test-Path "dist/flat/$n")) {
              Write-Output "::error::dist/flat/$n is missing; the installer needs both architectures"
              Get-ChildItem dist -Recurse | Select-Object FullName
              exit 1
            }
          }
          Get-ChildItem dist/flat | Select-Object Name, Length

      - name: Pack the installer
        shell: pwsh
        run: pwsh -NoProfile -File tools/pack-installer.ps1 -Dist dist/flat -OutFile dist/AHK-v2-Setup.exe

      # install -> assert PATH, association, patch marker, byte-exact extraction ->
      # uninstall -> assert full rollback.  This is the only thing that proves
      # the installer works rather than merely builds.
      - name: End-to-end install and rollback
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-installer.ps1 -Setup dist/AHK-v2-Setup.exe

      # Registry correctness is not the same as the association working, so this
      # launches a real .ahk through ShellExecute and waits for evidence.
      - name: Association actually launches a script
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-association.ps1 -Setup dist/AHK-v2-Setup.exe

      - name: Leave the machine clean
        if: always()
        shell: pwsh
        run: |
          # test-association.ps1 removes its own install in a finally block, but
          # a hard failure earlier can skip that; make the job idempotent.
          if (Test-Path 'C:\Program Files\AHK-v2\uninstall.exe') {
            & 'C:\Program Files\AHK-v2\uninstall.exe' /quiet
            Start-Sleep -Seconds 5
          }
          if (Test-Path 'C:\Program Files\AHK-v2') {
            Remove-Item 'C:\Program Files\AHK-v2' -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AHK-v2-Setup
          path: dist/AHK-v2-Setup.exe
          if-no-files-found: error
